[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "provision"
version = "0.7.1"
description = "Local-first AI coding CLI control plane, profile manager, and session dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Jeremy Dixon" },
]
keywords = [
  "account-manager",
  "ai-coding",
  "anthropic",
  "chatgpt",
  "claude-code",
  "cli",
  "connector",
  "context-window",
  "codex",
  "codex-cli",
  "credentials",
  "dashboard",
  "developer-tools",
  "gpt-5.6",
  "gpt-5.6-codex",
  "gpt-5.6-luna",
  "gpt-5.6-sol",
  "gpt-5.6-terra",
  "grok",
  "grok-build",
  "local-control-plane",
  "local-first",
  "model-catalog",
  "openai",
  "profile-manager",
  "proxy",
  "quota",
  "session-manager",
  "terminal",
  "usage-monitoring",
  "websocket",
  "xai",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development",
  "Topic :: System :: Shells",
]

[project.scripts]
provision = "provision.cli:main"
provision-codex = "provision.cli:main"

[project.optional-dependencies]
dev = [
  "coverage>=7.9",
  "mypy>=1.16",
  "ruff>=0.12",
]

[project.urls]
Homepage = "https://github.com/jeremydixon22/provision"
Repository = "https://github.com/jeremydixon22/provision"
Issues = "https://github.com/jeremydixon22/provision/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
provision = ["assets/*.png", "ui/*.html", "ui/*.css", "ui/*.js"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true

[tool.coverage.run]
branch = true
source = ["provision"]

[tool.coverage.report]
show_missing = true
skip_covered = true
