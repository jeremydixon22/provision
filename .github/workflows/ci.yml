name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Static analysis and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests tools

      - name: Check formatting
        run: ruff format --check src tests tools

      - name: Type-check extracted boundaries
        run: >-
          mypy
          src/provision/paths.py
          src/provision/daemon_host.py
          src/provision/daemon_logging.py
          src/provision/proxy_policy.py
          src/provision/providers.py
          src/provision/provider_sessions.py
          src/provision/ui_assets.py
          src/provision/connector.py
          src/provision/remote.py

      - name: Run coverage report
        run: |
          coverage run -m unittest discover -s tests
          coverage report

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile sources
        run: python -m compileall src tests tools bin/provision

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build package
        run: |
          python -m pip install build
          python -m build
